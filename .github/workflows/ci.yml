name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff
        run: uv run --no-sync ruff check src tests
      - name: Mypy
        run: uv run --no-sync mypy src/turbo_memory_mcp

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed-cache
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Cache fastembed model
        uses: actions/cache@v6
        with:
          path: .fastembed-cache
          key: fastembed-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            fastembed-${{ runner.os }}-
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run --no-sync pytest -q
